<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zero Market</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script defer src="{{ url_for('static', filename='app.js') }}"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="side-nav" aria-label="앱 정보">
        <a class="brand" href="/" aria-label="Zero Market 홈">
          <span class="brand-mark">Z</span>
          <span>
            <strong>Zero Market</strong>
            <small>소비 없는 소비 경험</small>
          </span>
        </a>
        <nav>
          <a class="active" href="#shop">Home</a>
          <a href="#about">About</a>
          <a href="#cart">Cart</a>
          <a href="/tracking">배송 조회</a>
        </nav>
        <div class="flow-panel">
          <span>이미지 생성</span>
          <span>탐색</span>
          <span>장바구니</span>
          <span>가상 결제</span>
        </div>
      </aside>

      <main class="shop-area" id="shop">
        <header class="top-bar">
          <div>
            <p class="eyebrow">Linux + Flask + JSON + Image API</p>
            <h1>오늘의 가상 쇼핑몰</h1>
          </div>
          <div class="status-strip">
            <span id="generatedAt">상품 구성 준비 중</span>
            <strong id="productCount">0 items</strong>
          </div>
        </header>

        <section class="control-band" aria-label="상품 생성과 검색">
          <form class="mood-form" id="moodForm">
            <label for="moodInput">생성할 상품</label>
            <div class="input-row">
              <input id="moodInput" name="keyword" type="text" placeholder="예: 텀블러, 립밤, 강아지 인형" autocomplete="off" />
              <button type="submit" class="primary-action">
                <i data-lucide="sparkles"></i>
                상품 만들기
              </button>
            </div>
          </form>
          <div class="search-box">
            <label for="searchInput">검색</label>
            <div class="input-row">
              <i data-lucide="search"></i>
              <input id="searchInput" type="search" placeholder="상품명, 카테고리, 키워드" autocomplete="off" />
            </div>
          </div>
        </section>

        <section class="category-tabs" id="categoryTabs" aria-label="카테고리 선택"></section>

        <section class="zero-note" id="about">
          <div>
            <strong>Zero Market</strong>
            <span>상품을 보고, 담고, 결제 흐름을 체험하지만 실제 소비는 일어나지 않는 쇼핑 앱입니다.</span>
          </div>
          <button class="ghost-action" id="clearCartButton" type="button">
            <i data-lucide="trash-2"></i>
            장바구니 비우기
          </button>
          <a class="ghost-action" href="/tracking">
            <i data-lucide="truck"></i>
            배송 조회
          </a>
        </section>

        <section class="product-grid" id="productGrid" aria-live="polite"></section>
      </main>

      <aside class="cart-rail" id="cart" aria-label="장바구니">
        <div class="cart-header">
          <div>
            <p class="eyebrow">Virtual Cart</p>
            <h2>장바구니</h2>
          </div>
          <span class="cart-count" id="cartCount">0</span>
        </div>
        <div class="cart-lines" id="cartLines"></div>
        <div class="cart-summary">
          <div>
            <span>가상 합계</span>
            <strong id="cartTotal">0원</strong>
          </div>
          <button class="primary-action full" id="checkoutButton" type="button" disabled>
            <i data-lucide="credit-card"></i>
            가상 결제 체험
          </button>
          <a class="ghost-action full" href="/tracking">
            <i data-lucide="package-search"></i>
            배송 조회
          </a>
        </div>
        <section class="checkout-result" id="checkout" hidden>
          <p class="eyebrow">Receipt</p>
          <h3 id="receiptTitle">가상 결제 완료</h3>
          <p id="receiptMessage"></p>
        </section>
      </aside>
    </div>

    <dialog class="product-dialog" id="productDialog">
      <button class="icon-button dialog-close" id="dialogClose" type="button" aria-label="닫기">
        <i data-lucide="x"></i>
      </button>
      <div class="dialog-body" id="dialogBody"></div>
    </dialog>
  </body>
</html>
